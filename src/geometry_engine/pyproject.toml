[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "vibecad-geom"
version = "0.1.0"
description = "Vibe-CADing C++ engine: SDF to watertight STL (vibecad_geom) and skeletal motion (vibecad_motion)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
