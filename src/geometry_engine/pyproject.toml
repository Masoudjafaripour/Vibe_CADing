[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "vibecad-geom"
version = "0.1.0"
description = "SDF grid to watertight STL mesh (marching cubes) for Vibe-CADing"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
