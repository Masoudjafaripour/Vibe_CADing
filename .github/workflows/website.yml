# Builds website/ (Astro) and deploys it to GitHub Pages:
# https://masoudjafaripour.github.io/Vibe_CADing/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/CAD_Harness/sdf/**"
      - "src/CAD_Harness/cadquery/*.png"
      - "src/CAD_Harness/cadquery/*.svg"
      - "src/B-rep/results/**"
      - "doc/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build # also copies the repo's renders into public/media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
